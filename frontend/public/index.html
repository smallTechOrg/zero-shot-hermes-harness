<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UP Police Data Analyst</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="shell">
<header class="topbar">
<h1>UP Police Data Analyst</h1>
<span id="provider-badge" class="badge" title="Active LLM provider">...</span>
</header>

<section class="card" id="upload-card">
<h2>Upload CSV</h2>
<p class="hint">Upload one or more CSV files to analyse.</p>
<input id="csv-input" type="file" accept=".csv" multiple />
<button id="upload-btn">Upload</button>
<p id="upload-status" class="status" hidden></p>
</section>

<section class="card" id="query-card">
<h2>Ask a question</h2>
<p class="hint">Ask a natural-language question over the uploaded data.</p>
<label for="question">Question</label>
<textarea id="question" rows="4" placeholder="e.g. Show district-wise count of incidents last month"></textarea>
<button id="run-btn">Run</button>
<div id="status" class="status" hidden></div>
<div id="error" class="error" hidden></div>
</section>

<section class="card" id="result-card" hidden>
<h2>Answer</h2>
<div id="answer" class="answer"></div>
<div id="table-wrap" class="table-wrap" hidden>
<h3>Result</h3>
<div class="table-scroll">
<table id="result-table"><thead></thead><tbody></tbody></table>
</div>
</div>
<div id="chart-wrap" class="chart-wrap" hidden>
<h3>Chart</h3>
<img id="chart-img" alt="Chart" />
</div>
<div id="export-wrap" class="export-wrap" hidden>
<h3>Export</h3>
<div id="export-links" class="export-links"></div>
</div>
<p class="meta" id="result-meta"></p>
</section>

<footer class="foot">
<span>API docs at <a href="/docs">/docs</a> &middot; health at <a href="/health">/health</a></span>
</footer>
</main>
<script src="app.js"></script>
</body>
</html>
